<!DOCTYPE html>
<meta charset=utf-8>
<title>Cookie Store API: Opaque origins for cookieStore</title>
<link rel=help href="https://cookiestore.spec.whatwg.org/">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script>

const apiCalls = {
  'get': 'cookieStore.get("cookie-name")',
  'getAll': 'cookieStore.getAll()',
  'set': 'cookieStore.set("cookie-name", "cookie-value")',
  'delete': 'cookieStore.delete("cookie-name")'
};

const script = `
<script>
  "use strict";
  window.onmessage = async () => {
    try {
      await %s;
      window.parent.postMessage({result: "no exception"}, "*");
    } catch (ex) {
      window.parent.postMessage({result: ex.name}, "*");
    };
  };
<\/script>
`;

function load_iframe(apiCall, sandbox) {
  return new Promise(resolve => {
    const iframe = document.createElement('iframe');
    iframe.onload = () => { resolve(iframe); };
    if (sandbox)
      iframe.sandbox = sandbox;
    iframe.srcdoc = script.replace('%s', apiCall);
    iframe.style.display = 'none';
    document.documentElement.appendChild(iframe);
  });
}

function wait_for_message(iframe) {
  return new Promise(resolve => {
    self.addEventListener('message', function listener(e) {
      if (e.source === iframe.contentWindow) {
        resolve(e.data);
        self.removeEventListener('message', listener);
      }
    });
  });
}

promise_test(async t => {
  for (apiCall in apiCalls) {
    const iframe = await load_iframe(apiCalls[apiCall]);
    iframe.contentWindow.postMessage({}, '*');
    const message = await wait_for_message(iframe);
    assert_equals(message.result, 'no exception',
      'cookieStore ${apiCall} should not throw');
  }
}, 'cookieStore in non-sandboxed iframe should not throw');

promise_test(async t => {
  for (apiCall in apiCalls) {
    const iframe = await load_iframe(apiCalls[apiCall], 'allow-scripts');
    iframe.contentWindow.postMessage({}, '*');
    const message = await wait_for_message(iframe);
    assert_equals(message.result, 'SecurityError',
      'cookieStore ${apiCall} should throw SecurityError');
  }
}, 'cookieStore in sandboxed iframe should throw SecurityError');

promise_test(async t => {
  const apiCall = 'cookieStore.addEventListener("change", e => {})';

  // Adding a listener in sandboxed iframe doesn't throw, since that would not
  // be consistent with how EventTarget is spec'd.
  const iframe = await load_iframe(apiCall, 'allow-scripts');
  iframe.contentWindow.postMessage({}, '*');
  const message = await wait_for_message(iframe);
  assert_equals(message.result, 'no exception',
                'cookieStore.addEventListener should not throw');
}, 'cookieStore in sandboxed iframe --- listener access');

// Additional test: sandbox with allow-same-origin should still throw SecurityError
promise_test(async t => {
  for (apiCall in apiCalls) {
    const iframe = await load_iframe(apiCalls[apiCall], 'allow-same-origin');
    iframe.contentWindow.postMessage({}, '*');
    const message = await wait_for_message(iframe);
    assert_equals(message.result, 'SecurityError',
      'cookieStore ${apiCall} with allow-same-origin should throw SecurityError');
  }
}, 'cookieStore in sandboxed iframe with allow-same-origin should throw SecurityError');

// Additional test: sandbox with allow-same-origin allow-scripts should still throw SecurityError
promise_test(async t => {
  for (apiCall in apiCalls) {
    const iframe = await load_iframe(apiCalls[apiCall], 'allow-same-origin allow-scripts');
    iframe.contentWindow.postMessage({}, '*');
    const message = await wait_for_message(iframe);
    assert_equals(message.result, 'SecurityError',
      'cookieStore ${apiCall} with allow-same-origin allow-scripts should throw SecurityError');
  }
}, 'cookieStore in sandboxed iframe with allow-same-origin allow-scripts should throw SecurityError');

// Additional test: sandbox without allow-scripts should not execute script at all
promise_test(async t => {
  const apiCall = 'cookieStore.get("cookie-name")';
  const iframe = await load_iframe(apiCall, '');
  iframe.contentWindow.postMessage({}, '*');
  // Without allow-scripts, the script won't execute, so no message will be sent
  // The test verifies that no exception is reported (timeout would indicate script didn't run)
  const message = await wait_for_message(iframe).catch(() => ({result: 'timeout'}));
  assert_equals(message.result, 'timeout',
    'cookieStore in sandbox without allow-scripts should not execute script');
}, 'cookieStore in sandboxed iframe without allow-scripts should not execute script');

// Additional test: addEventListener with allow-same-origin should not throw
promise_test(async t => {
  const apiCall = 'cookieStore.addEventListener("change", e => {})';
  const iframe = await load_iframe(apiCall, 'allow-same-origin');
  iframe.contentWindow.postMessage({}, '*');
  const message = await wait_for_message(iframe);
  assert_equals(message.result, 'no exception',
                'cookieStore.addEventListener with allow-same-origin should not throw');
}, 'cookieStore.addEventListener in sandboxed iframe with allow-same-origin should not throw');

</script>

</write_to_file>
